services:
  postgres:
    image: postgres:15-alpine
    container_name: anipaylas_postgres
    restart: always
    environment:
      POSTGRES_USER: wedding_admin
      POSTGRES_PASSWORD: wedding_password
      POSTGRES_DB: wedding_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: anipaylas_app
    restart: always
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://wedding_admin:wedding_password@postgres:5432/wedding_db?sslmode=disable}"
      DOWNLOAD_TOKEN_ENCRYPTION_KEY: "${DOWNLOAD_TOKEN_ENCRYPTION_KEY:-change_this_to_32_byte_secret_key_prod!}"
      JWT_SECRET: "${JWT_SECRET:-change_this_jwt_secret_prod}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-https://palmstudio.com.tr}"
    volumes:
      - storage_data:/app/storage
    depends_on:
      - postgres

volumes:
  postgres_data:
  storage_data:
